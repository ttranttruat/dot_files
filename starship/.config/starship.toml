"$schema" = "https://starship.rs/config-schema.json"

# ===============================
# Prompt
# ===============================
format = """
$directory\
$git_branch\
$git_status
$character
"""

right_format = "$cmd_duration"

# ===============================
# Component
# ===============================
[directory]
format = "[$path]($style) "

[git_branch]
format = "[$branch]($style) "

[git_status]
style = "bold purple"
format = '([\[ $all_status$ahead_behind\]]($style) )'
staged = "[+${count}](bright-green) "
modified = "[~${count}](bright-yellow) "
renamed = "[!${count}](bright-blue) "
deleted = "[-${count}](red) "
untracked = "[?${count}](bright-red) "
stashed = "[≡${count}](purple) "
conflicted = "[≠${count}](bold red) "

ahead = "[⇡${count}](bright-green) "
behind = "[⇣${count}](bright-red) "
diverged = "[⇕${ahead_count}⇣${behind_count}](bright-purple) "

[character]
success_symbol = "[»](bold green)"
error_symbol = "[»](bold red)"

[cmd_duration]
min_time = 500
format = "[◄ $duration](bright-white)"
